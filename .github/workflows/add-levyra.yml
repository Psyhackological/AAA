name: Add Levyra

on:
  push:
    branches:
      - add-levyra

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-levyra
          fetch-depth: 0
      - name: Update README
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("**AWESOME** apps counter: **273** 🎉", "**AWESOME** apps counter: **274** 🎉", 1)
          anchor = '''### Noad Player
'''
          block = '''### Levyra

> Open-source music player with streaming, smart discovery, synced lyrics, offline M4A downloads, and private on-device listening insights.

<img alt="LevyraIcon" height="64" src="https://raw.githubusercontent.com/LUC4N3X/Levyra-deepsound/main/app/src/main/res/drawable/levyra_logo.png">

- [ ] Google Play
- [x] [F-Droid](https://f-droid.org/packages/com.luc4n3x.levyra/)
- [x] [GitHub](https://github.com/LUC4N3X/Levyra-deepsound)
- [x] [Official page](https://levyra.dpdns.org/)

'''
          if "### Levyra" not in text:
              if anchor not in text:
                  raise SystemExit("Noad Player anchor not found")
              text = text.replace(anchor, block + anchor, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit
        run: |
          rm .github/workflows/add-levyra.yml
          git config user.name "LUC4N3X"
          git config user.email "241364318+LUC4N3X@users.noreply.github.com"
          git add README.md .github/workflows/add-levyra.yml
          git commit -m "Add Levyra"
          git push origin add-levyra
